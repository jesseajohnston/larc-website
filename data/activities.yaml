- title: Research seminar
  image: "pages/seminar-card-cover.jpg"
  text: "The LARC research seminar occurs each Fall and Winter semester and offers a forum for LARC members to share, workshop, and develop research. We generally focus on the work of currently enrolled doctoral students whose research centers on aspects of archival science, data science, digital curation, and social memory in varied knowledge environments. The group also hosts seminars focused on faculty research, current publications, and specialized topics related to library and information science (LIS), archives, and digital curation. The Fall 2026 semester occurs at noon on Fridays in Leinweber and online."
- title: Symposia & speakers
  text: "LARC sponsors and coordinates a series of speakers and symposia called DAIS, or Data, Archives, and Information in Society. We invite speakers to the DAIS whose work advances understanding in topics related to archives, curation, data, and libraries, as it is understood and critiqued within the context of information environments and social concerns."
  image: "pages/symposium-card-cover.jpg"
  button:
    label: "DAIS speaker series"
    page: "activities/dais"
