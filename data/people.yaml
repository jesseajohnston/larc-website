  - name: Suanmuanlian Tonsing
    bio: "Suanmuanlian Tonsing is a PhD candidate researching how digitally mediated archival misrepresentations on digital platforms impact the lifeworlds of Indigenous peoples. He is a member of the indigenous Paite-Zomi tribe, part of the Zo ancestry in the highlands of northeast India. Using Indigenous methodologies, he bridges archival science and Indigenous sociology in his work."
    links:
      - label: "UMSI profile"
