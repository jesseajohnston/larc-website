{{ define "main" }}
  <div
    class="hero text-white"
    {{- with resources.Get "images/leinweber-west-with-tower-cropped.png" }}
      style="background-image: linear-gradient(135deg, rgba(0, 39, 76, 0.85) 0%, rgba(0, 19, 36, 0.85) 100%), url('{{ .RelPermalink }}');"
    {{- end }}
  >
    <div class="container py-5 text-center">
      <h1 class="display-4 fw-bold hero__title">{{ site.Params.tagline }}</h1>
      <p class="text-uppercase fw-bold small mt-2 mb-0 hero__eyebrow">{{ site.Params.subtitle }}</p>
    </div>
  </div>

  <div class="py-5">
    <div class="container">
      <div class="col-lg-8 mx-auto">
        <h2 class="text-center">About</h2>
        {{ .Content }}
      </div>
    </div>
  </div>
