<div class="site-footer text-white py-5">
  <div class="container">
    <h2 class="site-footer__heading h6 text-uppercase mb-2">{{ site.Title }}</h2>
    <p class="mb-4">
      <a class="text-white" href="{{ site.Params.mapsURL }}">
        {{ site.Params.department }}<br>
        {{ site.Params.address }}
      </a>
    </p>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 pt-3 small">
      <p class="mb-0">&copy; {{ now.Year }} The Regents of the University of Michigan</p>
      <ul class="nav">
        {{ range site.Menus.footer }}
          <li class="nav-item"><a class="nav-link text-white px-2" href="{{ .URL }}">{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </div>
  </div>
</div>
