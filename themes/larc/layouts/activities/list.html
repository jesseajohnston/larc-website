{{ define "main" }}
  <div class="page-header bg-light py-4">
    <div class="container">
      <h1>{{ .Title }}</h1>
    </div>
  </div>
  <div class="py-5">
    <div class="container">
      {{ with .Content }}<div class="col-lg-8 mb-4">{{ . }}</div>{{ end }}
      <div class="row row-cols-1 row-cols-md-2 g-4">
        {{ range hugo.Data.activities }}
          <div class="col">
            <div class="card h-100 border-0">
              {{ with .image }}
                {{ with resources.Get (printf "images/%s" .) }}
                  <img class="card-img-top img-fluid" src="{{ .RelPermalink }}" width="{{ .Width }}" height="{{ .Height }}" alt="">
                {{ end }}
              {{ end }}
              <div class="card-body d-flex flex-column">
                <h2 class="card-title h4">{{ .title }}</h2>
                <p class="card-text">{{ .text }}</p>
                {{ with .button }}
                  <div class="mt-auto">
                    <a class="btn btn-primary" href="{{ (site.GetPage .page).RelPermalink }}">{{ .label }}</a>
                  </div>
                {{ end }}
              </div>
            </div>
          </div>
        {{ end }}
      </div>
    </div>
  </div>
{{ end }}
